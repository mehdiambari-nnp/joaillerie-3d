# Déploiement Firebase Hosting : aperçu sur chaque pull request, production à chaque push sur main.
# Authentification sans clé (Workload Identity Federation). Variables de dépôt : WIF_PROVIDER, WIF_SERVICE_ACCOUNT, FIREBASE_PROJECT_ID.
name: Firebase Hosting
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test --if-present -- --exclude tests/unit/import.test.js
      - run: npm run build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Déployer
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npx firebase deploy --only hosting --project ${{ vars.FIREBASE_PROJECT_ID }} --non-interactive --debug
          else
            npx firebase hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project ${{ vars.FIREBASE_PROJECT_ID }} --non-interactive --debug
          fi
